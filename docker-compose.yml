version: '3.8'

services:
  tubadventure-web:
    image: thomasherve/tubadventure:latest
    container_name: tubadventure-web
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Limites de ressources
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

