user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml text/x-component text/x-cross-domain-policy;
    gzip_min_length 1000;

    # Server configuration for WebGL Unity
    server {
        listen 80;
        server_name _;

        # Headers nécessaires pour WebGL et les .wasm
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # Configuration pour les fichiers .wasm.br (WebAssembly compressé Brotli)
        location ~ \.wasm\.br$ {
            gzip off;
            default_type application/wasm;
            add_header Content-Encoding "br" always;
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            expires 1h;
        }

        # Configuration pour les fichiers .wasm avec le bon MIME type
        location ~ \.wasm$ {
            default_type application/wasm;
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            expires 1h;
        }

        # Configuration pour les fichiers .data.br (Data compressé)
        location ~ \.data\.br$ {
            gzip off;
            default_type application/octet-stream;
            add_header Content-Encoding "br" always;
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            expires 1h;
        }

        # Configuration pour les fichiers .framework.js.br (Framework compressé)
        location ~ \.framework\.js\.br$ {
            default_type text/javascript;
            add_header Content-Encoding "br" always;
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            expires 1h;
        }

        # Fichiers JavaScript
        location ~ \.js$ {
            add_header Cache-Control "public, max-age=3600" always;
            expires 1h;
        }

        # Fichiers CSS
        location ~ \.css$ {
            add_header Cache-Control "public, max-age=86400" always;
            expires 1d;
        }

        # Fichiers HTML - pas de cache
        location ~ \.html?$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires -1;
        }

        location ~ \.mp4 {
            mp4;
            mp4_buffer_size     1M;
            mp4_max_buffer_size 3M;
            expires 1d;
        }

        # Fallback vers index.html pour le routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
            access_log off;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
