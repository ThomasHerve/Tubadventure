user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression - désactivé pour les fichiers .br/.gz précompressés
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml text/x-component text/x-cross-domain-policy;
    gzip_min_length 1000;
    gzip_disable "MSIE [1-6]\.";

    # Server configuration for WebGL Unity
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # Headers CORS/Security - UNE SEULE FOIS au niveau serveur
        # Ces headers seront hérités par toutes les locations sauf si override
        # Note: COEP désactivé pour iOS/Safari (problèmes de chargement)
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Fichiers HTML - pas de cache, headers spécifiques
        location ~ \.html?$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;
            
            # Réappliquer les headers de sécurité critiques
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
        }

        # ===== FICHIERS BROTLI (.br) =====
        # Unity data files (.data.br)
        location ~* ^/Build/(.+)\.data\.br$ {
            default_type application/octet-stream;
            add_header Content-Encoding br always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Vary "Accept-Encoding" always;
            gzip off;
            try_files $uri =404;
        }

        # WASM files (.wasm.br)
        location ~* ^/Build/(.+)\.wasm\.br$ {
            default_type application/wasm;
            add_header Content-Encoding br always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Vary "Accept-Encoding" always;
            gzip off;
            try_files $uri =404;
        }

        # JavaScript files (.js.br)
        location ~* ^/Build/(.+)\.js\.br$ {
            default_type application/javascript;
            add_header Content-Encoding br always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Vary "Accept-Encoding" always;
            gzip off;
            try_files $uri =404;
        }

        # Framework files (.framework.js.br)
        location ~* ^/Build/(.+)\.framework\.js\.br$ {
            default_type application/javascript;
            add_header Content-Encoding br always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Vary "Accept-Encoding" always;
            gzip off;
            try_files $uri =404;
        }

        # ===== FICHIERS GZIP (.gz) =====
        gzip_static on;

        # Unity data files (.data.gz)
        location ~* ^/Build/(.+)\.data\.gz$ {
            default_type application/octet-stream;
            add_header Content-Encoding gzip always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Vary "Accept-Encoding" always;
            gzip off;
            try_files $uri =404;
        }

        # WASM files (.wasm.gz)
        location ~* ^/Build/(.+)\.wasm\.gz$ {
            default_type application/wasm;
            add_header Content-Encoding gzip always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Vary "Accept-Encoding" always;
            gzip off;
            try_files $uri =404;
        }

        # JavaScript files (.js.gz)
        location ~* ^/Build/(.+)\.js\.gz$ {
            default_type application/javascript;
            add_header Content-Encoding gzip always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Vary "Accept-Encoding" always;
            gzip off;
            try_files $uri =404;
        }

        # Framework files (.framework.js.gz)
        location ~* ^/Build/(.+)\.framework\.js\.gz$ {
            default_type application/javascript;
            add_header Content-Encoding gzip always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Vary "Accept-Encoding" always;
            gzip off;
            try_files $uri =404;
        }

        # ===== FICHIERS NON-COMPRESSÉS =====
        # Fichiers WASM non compressés
        location ~* \.wasm$ {
            default_type application/wasm;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
        }

        # Fichiers JavaScript non compressés
        location ~ \.js$ {
            default_type application/javascript;
            add_header Cache-Control "public, max-age=3600" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Access-Control-Allow-Origin "*" always;
            expires 1h;
        }

        # Fichiers CSS
        location ~ \.css$ {
            add_header Cache-Control "public, max-age=86400" always;
            expires 1d;
        }

        # Vidéos MP4 dans StreamingAssets
        location ~* ^/StreamingAssets/(.+)\.mp4$ {
            mp4;
            mp4_buffer_size 1M;
            mp4_max_buffer_size 3M;
            add_header Cache-Control "public, max-age=86400" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            expires 1d;
        }

        # Fallback intelligent pour fichiers Build
        # Essayer d'abord le fichier demandé, puis les versions compressées brotli/gzip
        location ~ ^/Build/ {
            try_files $uri $uri.br $uri.gz =404;
        }

        # Fallback pour tous les autres fichiers
        location / {
            try_files $uri $uri/ =404;
        }

        # Health check
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
            access_log off;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}