user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml text/x-component text/x-cross-domain-policy;
    gzip_min_length 1000;

    # Server configuration for WebGL Unity
    server {
        listen 80;
        server_name _;

        # Headers nécessaires pour WebGL et les .wasm
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        root /usr/share/nginx/html;
        index index.html index.htm;

         # Cross-origin isolation for WebGL multithreading/SIMD
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        # Serve Unity precompressed Brotli files (.br)
        location ~* ^/Build/(.+)\.data\.br$ {
            types { application/octet-stream data; }  # or leave default
            default_type application/octet-stream;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Cross-Origin-Resource-Policy "same-origin";
            try_files $uri =404;
        }
        location ~* ^/Build/(.+)\.wasm\.br$ {
            default_type application/wasm;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Cross-Origin-Resource-Policy "same-origin";
            try_files $uri =404;
        }
        location ~* ^/Build/(.+)\.js\.br$ {
            default_type application/javascript;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Cross-Origin-Resource-Policy "same-origin";
            try_files $uri =404;
        }

        # If I rebuild with gzip instead of brotli:
        gzip_static on;
        location ~* ^/Build/(.+)\.(data|wasm|js)\.gz$ {
            # Unity emits .gz files; serve with the base MIME and Content-Encoding gzip
            set $ext $2;
            if ($ext = wasm) { set $ct application/wasm; }
            if ($ext = js)   { set $ct application/javascript; }
            if ($ext = data) { set $ct application/octet-stream; }
            default_type application/wasm;
            add_header Content-Encoding gzip;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Cross-Origin-Resource-Policy "same-origin";
            try_files $uri =404;
        }

        # Static assets (images, StreamingAssets)
        location / {
            try_files $uri $uri/ =404;
        }


        # Fichiers JavaScript
        location ~ \.js$ {
            add_header Cache-Control "public, max-age=3600" always;
            expires 1h;
        }

        # Fichiers CSS
        location ~ \.css$ {
            add_header Cache-Control "public, max-age=86400" always;
            expires 1d;
        }

        # Fichiers HTML - pas de cache
        location ~ \.html?$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires -1;
        }

        location  ~* ^/StreamingAssets/(.+)\.mp4 {
            mp4;
            mp4_buffer_size     1M;
            mp4_max_buffer_size 3M;
            expires 1d;
        }
        
        # Health check
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
            access_log off;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
